[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workbench-utils"
version = "0.1.0"
description = "Downstream Single-Cell Analysis Workbench Utilities (Scanpy, PyDESeq2, AnnData)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Bioinformatics Team", email = "info@antigravity.bio" }
]
keywords = [
    "single-cell",
    "transcriptomics",
    "scanpy",
    "anndata",
    "pydeseq2",
    "scrublet",
    "harmony",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "pydeseq2>=0.5.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",
    "scrublet>=0.2.3",
    "harmonypy>=0.0.9",
    "gseapy>=1.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.1.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0",
    "nbclient>=0.10.0",
    "papermill>=2.5.0",
    "jupytext>=1.16.0",
    "nbstripout>=0.7.0",
    "nbconvert>=7.16.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]
all = [
    "workbench-utils[notebooks,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench_utils", "src/sc_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
