[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sc-workbench"
version = "0.1.0"
description = "Production Downstream Single-Cell Analysis Workbench (Scanpy, AnnData, Scrublet, Harmony, GSEAPY)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Bioinformatics Team", email = "info@antigravity.bio" }
]
keywords = [
    "single-cell",
    "transcriptomics",
    "scanpy",
    "anndata",
    "scrublet",
    "harmony",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",
    "scrublet>=0.2.3",
    "harmonypy>=0.0.9",
    "gseapy>=1.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.1.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0",
    "nbclient>=0.10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
all = [
    "sc-workbench[notebooks,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["sc_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
