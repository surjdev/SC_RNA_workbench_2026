# .pre-commit-config.yaml
# Single-cell Analysis Workbench Git Hygiene & Quality Configuration
# Complies with scRNAseq_Workbench_Requirements.md (FR-3, NFR-6, Tech Stack)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=5000']

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        name: Strip Jupyter Notebook Outputs
        files: '\.ipynb$'

  - repo: https://github.com/mwouts/jupytext
    rev: v1.16.7
    hooks:
      - id: jupytext
        name: Sync Jupytext paired notebooks
        files: '^notebooks/.*\.(ipynb|py)$'
        args: ['--sync']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        name: Ruff Linter
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff Formatter
